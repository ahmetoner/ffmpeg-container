name: Publish Docker Image
on:
  push:
    tags:
      - '*'

env:
  IMAGE: ${{ secrets.DOCKER_USER }}/${{ secrets.CONTAINER_NAME }}
  TRIVY: docker run --rm -v /home/runner/.docker/config.json:/root/.docker/config.json:ro aquasec/trivy:0.76.2

jobs:
  # Each platform is built on a native runner, as compiling FFmpeg under QEMU emulation is very slow
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: ${{ matrix.platform }}
        push: true
        provenance: false
        build-args: |
          FFMPEG_VERSION=${{ github.ref_name }}
        tags: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}

  # Scan the per-platform images, then combine them into the multi-platform tags.
  # Fixable HIGH/CRITICAL vulnerabilities fail the release; MEDIUM ones only produce a warning.
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Trivy scan (HIGH, CRITICAL)
      run: |
        for arch in amd64 arm64; do
          $TRIVY image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:$GITHUB_REF_NAME-$arch"
        done

    - name: Trivy scan (MEDIUM)
      run: |
        status=0
        $TRIVY image --scanners vuln --severity MEDIUM --ignore-unfixed --exit-code 2 "$IMAGE:$GITHUB_REF_NAME-amd64" || status=$?
        if [ "$status" = 2 ]; then echo "::warning::Trivy found MEDIUM vulnerabilities, see the scan output"; elif [ "$status" != 0 ]; then exit "$status"; fi

    - name: Create multi-platform tags
      run: |
        docker buildx imagetools create \
          -t "$IMAGE:latest" \
          -t "$IMAGE:$GITHUB_REF_NAME" \
          "$IMAGE:$GITHUB_REF_NAME-amd64" \
          "$IMAGE:$GITHUB_REF_NAME-arm64"

  release:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
